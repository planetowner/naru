name: naru
description: Private Flutter chat client for naru.
publish_to: none
version: 1.0.0+11

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # 앱 아이콘과 별개로 Flutter 기본 iOS UI가 빌드 중 참조하는 글꼴이에요.
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.0
  flutter_secure_storage: 10.3.1
  html: 0.15.6
  http: 1.6.0
  image_picker: 1.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  photo_manager: 3.9.0
  record: ^7.1.1
  url_launcher: 6.3.2
  video_player: ^2.11.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 네이티브 시작 화면과 같은 원본에서 만든 해상도별 로고를 사용해요.
    - assets/brand/naru-symbol.png
    - assets/fonts/OFL.txt
    - assets/fonts/material_symbols/LICENSE.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: NaruSymbolsRounded
      fonts:
        - asset: assets/fonts/material_symbols/MaterialSymbolsRounded.ttf
    - family: NaruSymbolsRoundedFilled
      fonts:
        - asset: assets/fonts/material_symbols/MaterialSymbolsRoundedFilled.ttf
