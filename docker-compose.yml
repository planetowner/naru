services:
  postgres:
    image: postgres:16-alpine
    container_name: naru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - naru-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naru-postgres-data:
